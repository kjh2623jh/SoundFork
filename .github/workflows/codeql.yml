name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 2'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpp:
    name: C++ / Windows x64
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      # A fresh hosted runner builds the real Windows-only targets, including OBS.
      # Do not reuse compiled objects: CodeQL must observe the compiler invocations.
      - name: Build and test
        shell: pwsh
        run: ./scripts/Build-SoundFork.ps1 -Configuration Release -WithObsPlugin

      - name: Analyze source
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:c-cpp/windows-x64
