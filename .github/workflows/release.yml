name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed tag to package
        required: true
        type: string

permissions:
  contents: read

# Keep retries/manual runs of one tag from interleaving release asset uploads.
concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify Windows x64 release
    runs-on: windows-2022
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.version.outputs.commit }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      manifest-sha256: ${{ steps.manifest.outputs.sha256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false

      - name: Validate tag and project version
        id: version
        shell: pwsh
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:REQUESTED_TAG
          if ($tag -notmatch '^v(?<base>[0-9]+\.[0-9]+\.[0-9]+)(?<suffix>-(?:alpha|beta|rc)\.[0-9]+)?$') {
            throw "Unsupported release tag '$tag'."
          }
          $tagBase = $Matches.base
          $tagSuffix = $Matches.suffix
          $cmake = Get-Content -LiteralPath CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\s*\(\s*SoundFork\s+VERSION\s+(?<version>[0-9]+\.[0-9]+\.[0-9]+)') {
            throw 'Could not read the CMake project version.'
          }
          $cmakeVersion = $Matches.version
          if ($cmakeVersion -ne $tagBase) {
            throw "Tag base version '$tagBase' does not match CMake version '$cmakeVersion'."
          }
          $version = "$tagBase$tagSuffix"
          $prerelease = if ($tagSuffix) { 'true' } else { 'false' }
          $expectedSetupLink = "../../releases/download/$tag/SoundFork-Setup-$tag.exe"
          foreach ($readme in @('README.md', 'README.en.md')) {
            $readmeText = Get-Content -LiteralPath $readme -Raw
            if (-not $readmeText.Contains($expectedSetupLink)) {
              Write-Warning "$readme does not point its direct Setup download to '$expectedSetupLink'."
            }
          }

          git fetch origin main --no-tags
          $releaseSha = (git rev-parse HEAD).Trim()
          $tagSha = (git rev-parse "$tag^{commit}").Trim()
          if ($releaseSha -ne $tagSha) {
            throw "Checked out commit '$releaseSha' does not match tag '$tag' ($tagSha)."
          }
          git merge-base --is-ancestor $releaseSha origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tag commit is not contained in origin/main.'
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$prerelease" >> $env:GITHUB_OUTPUT
          "commit=$releaseSha" >> $env:GITHUB_OUTPUT

      - name: Build, test, and package
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
          TIMESTAMP_URL: ${{ vars.WINDOWS_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hasPfx = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)
          if ($hasPfx -ne $hasPassword) {
            throw 'Both WINDOWS_SIGNING_PFX_BASE64 and WINDOWS_SIGNING_PFX_PASSWORD must be configured.'
          }
          if (-not $hasPfx) {
            Write-Warning 'No signing certificate is configured; release artifacts will be unsigned.'
            ./scripts/Build-ReleasePackage.ps1 -Version '${{ steps.version.outputs.version }}'
            exit $LASTEXITCODE
          }
          if ([string]::IsNullOrWhiteSpace($env:TIMESTAMP_URL)) {
            throw 'WINDOWS_TIMESTAMP_URL must be configured for signed releases.'
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP 'soundfork-signing.pfx'
          $importedCertificate = $null
          try {
            [IO.File]::WriteAllBytes(
              $pfxPath,
              [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $securePassword = ConvertTo-SecureString `
              $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $importedCertificate = @(
              Import-PfxCertificate `
                -FilePath $pfxPath `
                -CertStoreLocation Cert:\CurrentUser\My `
                -Password $securePassword `
                -Exportable:$false
            ) | Where-Object HasPrivateKey | Select-Object -First 1
            if ($null -eq $importedCertificate) {
              throw 'The PFX did not contain a certificate with a private key.'
            }
            ./scripts/Build-ReleasePackage.ps1 `
              -Version '${{ steps.version.outputs.version }}' `
              -CertificateThumbprint $importedCertificate.Thumbprint `
              -TimestampUrl $env:TIMESTAMP_URL
          } finally {
            if ($null -ne $importedCertificate) {
              Remove-Item -LiteralPath $importedCertificate.PSPath -Force
            }
            if (Test-Path -LiteralPath $pfxPath) {
              Remove-Item -LiteralPath $pfxPath -Force
            }
          }

      - name: Verify release binary dependencies
        shell: pwsh
        run: ./scripts/Test-ReleaseDependencies.ps1

      - name: Verify checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($line in Get-Content -LiteralPath artifacts/SHA256SUMS.txt) {
            if ($line -notmatch '^([0-9a-f]{64})  (.+)$') {
              throw "Malformed checksum line: $line"
            }
            $actual = (Get-FileHash -LiteralPath (Join-Path artifacts $Matches[2]) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $Matches[1]) {
              throw "Checksum mismatch for $($Matches[2])."
            }
          }

      - name: Smoke-test installer and uninstaller
        shell: pwsh
        run: |
          $testDirectory = Join-Path `
            ([IO.Path]::GetTempPath()) `
            ('SoundForkInstallerTest-' + [Guid]::NewGuid().ToString('N'))
          ./scripts/Test-ReleaseInstaller.ps1 `
            -SetupPath 'artifacts/SoundFork-Setup-v${{ steps.version.outputs.version }}.exe' `
            -TestDirectory $testDirectory `
            -AllowRegistryChanges

      - name: Upload workflow artifact
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SoundFork-${{ steps.version.outputs.version }}-release
          if-no-files-found: error
          retention-days: 30
          path: |
            artifacts/SoundFork-Setup-v${{ steps.version.outputs.version }}.exe
            artifacts/SoundFork-v${{ steps.version.outputs.version }}-windows-x64.zip
            artifacts/SHA256SUMS.txt

      - name: Record immutable checksum manifest
        id: manifest
        shell: pwsh
        run: |
          $hash = (Get-FileHash -LiteralPath artifacts/SHA256SUMS.txt -Algorithm SHA256).Hash.ToLowerInvariant()
          "sha256=$hash" >> $env:GITHUB_OUTPUT

  malware-scan:
    name: ClamAV / final release files
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LC_ALL: C.UTF-8
    steps:
      - name: Check out the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Download the exact build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          digest-mismatch: error
          path: artifacts

      - name: Verify artifact identity before scanning
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          python3 scripts/scan_release.py --verify-only --artifacts artifacts \
            --version "$RELEASE_VERSION" --manifest-sha256 "$MANIFEST_SHA256"

      - name: Install ClamAV and refresh official signatures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p security-logs
          echo '## ClamAV preparation' >> "$GITHUB_STEP_SUMMARY"
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clamav clamav-freshclam
          sudo systemctl stop clamav-freshclam
          if ! sudo freshclam --stdout 2>&1 | tee security-logs/freshclam.log; then
            echo 'Signature refresh failed; release publication is blocked.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          clamscan --version | tee security-logs/clamav-version.log

      - name: Test scanner failure handling with real ClamAV
        env:
          SOUNDFORK_TEST_CLAMAV: '1'
        run: python3 -B -m unittest discover -s tests -p test_scan_release.py -v

      - name: Scan installer, ZIP and extracted payload
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          python3 scripts/scan_release.py --artifacts artifacts --reports security-logs \
            --version "$RELEASE_VERSION" --manifest-sha256 "$MANIFEST_SHA256"

      - name: Preserve security logs even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: SoundFork-${{ needs.build.outputs.version }}-security-logs
          path: security-logs/
          if-no-files-found: warn
          retention-days: 30

  publish:
    name: Publish scanned release
    needs: [build, malware-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the built commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false

      - name: Download the same scanned artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id }}
          merge-multiple: true
          digest-mismatch: error
          path: artifacts

      - name: Reverify files before publication
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          MANIFEST_SHA256: ${{ needs.build.outputs.manifest-sha256 }}
        run: |
          python3 scripts/scan_release.py --verify-only --artifacts artifacts \
            --version "$RELEASE_VERSION" --manifest-sha256 "$MANIFEST_SHA256"

      - name: Refuse a tag moved since the build
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.build.outputs.commit }}
        run: |
          git fetch --no-tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Could not revalidate the release tag.' }
          $tagCommit = (git rev-parse 'FETCH_HEAD^{commit}').Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:RELEASE_COMMIT) {
            throw 'Release tag changed since the build; refusing publication.'
          }

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
          IS_PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = @(
            "artifacts/SoundFork-Setup-v$env:RELEASE_VERSION.exe",
            "artifacts/SoundFork-v$env:RELEASE_VERSION-windows-x64.zip",
            'artifacts/SHA256SUMS.txt'
          )
          & gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            & gh release upload $env:RELEASE_TAG @assets --clobber
          } else {
            $arguments = @(
              'release', 'create', $env:RELEASE_TAG,
              '--title', "SoundFork $env:RELEASE_TAG",
              '--generate-notes'
            )
            if ($env:IS_PRERELEASE -eq 'true') {
              $arguments += '--prerelease'
            }
            $arguments += $assets
            & gh @arguments
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'GitHub Release publishing failed.'
          }
