name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-tools:
    name: Release security tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release validation and scanner failure handling
        run: python3 -B -m unittest discover -s tests -p test_scan_release.py -v

  windows-x64:
    name: Windows x64 / ${{ matrix.configuration }}
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Default CTest includes unit/integration and the short accelerated soak.
      # Do not filter out audio, security-related, or deployment regression gates.
      - name: Build and test (including short accelerated soak)
        shell: pwsh
        run: ./scripts/Build-SoundFork.ps1 -Configuration '${{ matrix.configuration }}' -WithObsPlugin

      - name: Preserve CTest logs even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: soundfork-windows-x64-${{ matrix.configuration }}-test-logs
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/windows-msvc-x64/Testing/Temporary/LastTest.log
            build/windows-msvc-x64/Testing/Temporary/LastTestsFailed.log

      - name: MSVC static analysis
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: ./scripts/Test-SoundForkStaticAnalysis.ps1 -Configuration Release -WithObsPlugin

      - name: Upload Release binaries
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: soundfork-windows-x64-release
          if-no-files-found: error
          retention-days: 14
          path: |
            build/windows-msvc-x64/Release/soundfork_driver.dll
            build/windows-msvc-x64/Release/soundfork_control.exe
            build/windows-msvc-x64/Release/soundfork_discord_relay.exe
            build/windows-msvc-x64/Release/soundfork_capture_hub.exe
            build/windows-msvc-x64/Release/soundfork-obs.dll
            build/windows-msvc-x64/Release/obs-plugin/
            build/windows-msvc-x64/Release/soundfork_capture_monitor.exe
            build/windows-msvc-x64/Release/soundfork_host.exe
